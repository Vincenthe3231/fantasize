# Edge Functions are NOT deployed by Supabase’s database migration job (see docs/SCOUT_LIVE_ROLLOUT.md).
# Add repo secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF (e.g. nkijmkgdazikhyjpwcsl).
# Optional: OPENROUTER_API_KEY in GitHub secrets + uncomment the secrets set step below.

name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-supabase-edge-functions.yml'
      - 'supabase/config.toml'
  workflow_dispatch:

concurrency:
  group: supabase-edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy scout-execute
        run: |
          supabase functions deploy scout-execute --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"

      # Uncomment to sync OpenRouter key from GitHub Actions secrets (one-way to Supabase; prefer Dashboard for prod).
      # - name: Set OPENROUTER_API_KEY on project
      #   env:
      #     OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      #   run: |
      #     supabase secrets set "OPENROUTER_API_KEY=${OPENROUTER_API_KEY}" --project-ref "$SUPABASE_PROJECT_REF"
